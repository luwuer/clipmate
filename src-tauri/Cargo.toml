[package]
name = "clipmate"
version = "0.1.0"
description = "A minimal macOS clipboard history tool"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3", features = ["image-data"] }
base64 = "0.22"
png = "0.17"
core-graphics = { version = "0.25", features = ["elcapitan"] }
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
block2 = "0.6"

[profile.release]
strip = true
lto = true
codegen-units = 1
