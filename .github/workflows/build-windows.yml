name: Build Windows Installer

# W1 Windows 移植：GitHub Actions 出正式安装包（本机 cargo check 只做编译验证，
# 官方建议 Windows 产物在 windows runner 上构建，见 RELEASING.md）
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Install frontend dependencies
        working-directory: ui
        run: npm install

      - name: Build frontend
        working-directory: ui
        run: npm run build

      - name: Build Tauri app (NSIS x64)
        # bundle.targets 里 nsis 适用 Windows；app（macOS）自动跳过
        run: npx -y @tauri-apps/cli@2 build --manifest-path app/tauri.conf.json

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipMate-windows-x64
          path: |
            app/target/release/bundle/nsis/*.exe
            app/target/release/clipmate.exe
          if-no-files-found: error

      - name: Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            app/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
