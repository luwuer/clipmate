name: Build Apps

# 双平台构建：Windows NSIS 安装包 + macOS Universal DMG
# - push main：产出 artifact（登录 GitHub 后可下载）
# - push tag v*：聚合双平台产物发布 GitHub Release（匿名可下载，Pages 落地页指向这里）
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Build frontend
        working-directory: ui
        run: |
          npm install
          npm run build

      - name: Build Tauri app (NSIS x64)
        # 注意：tauri CLI 没有 --manifest-path 参数（那是 cargo 的），
        # 正确方式是在 tauri 目录（app/）里直接运行，让 CLI 自动发现 tauri.conf.json
        working-directory: app
        run: npx -y @tauri-apps/cli@2 build --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipMate-windows-x64
          path: app/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "Setup Rust (universal: aarch64 + x86_64)"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Build frontend
        working-directory: ui
        run: |
          npm install
          npm run build

      # CI 产物为 ad-hoc 签名（无 Developer ID），用户首次打开需右键 → 打开
      - name: Build Tauri app (Universal DMG)
        working-directory: app
        run: npx -y @tauri-apps/cli@2 build --target universal-apple-darwin --bundles dmg

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipMate-macos-universal
          path: app/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # tag 推送时聚合双平台产物发布 Release（非 tag 跳过）
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 创建/上传 Release 资产
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      # 统一为不带版本号的稳定文件名：落地页的 releases/latest/download/ 链接永久有效
      - name: Rename to stable asset names
        run: |
          cd out
          mv ClipMate_*_x64-setup.exe ClipMate_x64-setup.exe 2>/dev/null || true
          mv ClipMate_*_universal.dmg ClipMate_universal.dmg 2>/dev/null || true
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
