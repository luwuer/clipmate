name: Deploy Pages

# 产品介绍页：docs/ 变更或手动触发时部署到 GitHub Pages
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 注意：不能用 enablement: true —— GitHub 平台禁止 GITHUB_TOKEN 调用
      # Create Pages site API（2022 安全策略，workflow 权限声明无效）。
      # 需在仓库 Settings → Pages → Source 选 "GitHub Actions" 手动开启一次。
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
