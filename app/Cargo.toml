[package]
name = "clipmate"
version = "0.2.1"
description = "A minimal cross-platform (macOS/Windows) clipboard history tool"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3", features = ["image-data"] }
base64 = "0.22"
png = "0.17"

# ---------- 平台专属依赖（Windows 打包必需，见 RELEASING.md） ----------
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["elcapitan"] }
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
# 与 tauri 2.11 依赖树中的 windows 0.61 对齐，feature 合并、零重复编译
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
