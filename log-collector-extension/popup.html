<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { width: 320px; margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f5f7fb; color: #1f2329; }
  .wrap { padding: 16px; }
  h3 { margin: 0 0 10px; font-size: 15px; }
  p { font-size: 12px; color: #646a73; line-height: 1.7; margin: 0 0 12px; }
  .ok { color: #00b96b; }
  button { display: block; width: 100%; margin-top: 8px; padding: 9px 12px; border: none; border-radius: 8px;
           font-size: 13px; cursor: pointer; background: #4f7cff; color: #fff; }
  button.ghost { background: #fff; color: #4f7cff; border: 1px solid #4f7cff; }
  button:hover { opacity: .88; }
</style>
</head>
<body>
<div class="wrap">
  <h3>日志自循环收集分析器</h3>
  <p id="tip">先在浏览器打开 log.wwitil.woa.com 的日志查询页并执行一次查询，再点击下方按钮抓取查询参数。</p>
  <button id="btnGrab">抓取当前页参数并打开收集器</button>
  <button id="btnOpen" class="ghost">直接打开收集器</button>
</div>
<script src="popup.js"></script>
</body>
</html>
