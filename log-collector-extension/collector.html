<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>日志自循环收集分析器</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
         background: #f5f7fb; color: #1f2329; }
  .container { max-width: 1080px; margin: 0 auto; padding: 28px 24px 60px; }
  header { background: linear-gradient(135deg,#4f7cff 0%,#722ed1 100%); color: #fff;
           border-radius: 16px; padding: 24px 28px; margin-bottom: 20px; }
  header h1 { margin: 0 0 8px; font-size: 22px; }
  header .meta { font-size: 13px; opacity: .92; line-height: 1.8; }
  .panel { background: #fff; border-radius: 14px; padding: 20px 22px; margin-bottom: 20px;
           box-shadow: 0 1px 4px rgba(31,35,41,.06); }
  .panel h2 { margin: 0 0 14px; font-size: 16px; }
  .panel h2 .sub, h3 .sub { font-size: 12px; font-weight: 400; color: #8a919f; margin-left: 10px; }
  label { display: block; font-size: 12px; color: #646a73; margin-bottom: 5px; }
  textarea, input, select { width: 100%; padding: 8px 10px; border: 1px solid #dcdfe6; border-radius: 8px;
                    font-size: 13px; font-family: inherit; outline: none; background: #fff; }
  textarea { resize: vertical; font-family: Menlo, Consolas, monospace; font-size: 12px; word-break: break-all; }
  textarea:focus, input:focus, select:focus { border-color: #4f7cff; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 12px; }
  .btns { display: flex; align-items: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  button { padding: 9px 18px; border: none; border-radius: 8px; font-size: 13px; cursor: pointer;
           background: #eef1f6; color: #1f2329; }
  button.primary { background: #4f7cff; color: #fff; }
  button.primary:hover { background: #3f6df2; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.sm { padding: 3px 10px; font-size: 12px; border-radius: 6px; }
  .status { font-size: 13px; color: #646a73; margin-left: auto; }
  .loglist { background: #20242a; color: #c9d1d9; border-radius: 10px; padding: 12px 14px; height: 240px;
             overflow-y: auto; font-family: Menlo, Consolas, monospace; font-size: 12px; line-height: 1.9;
             white-space: pre-wrap; word-break: break-all; }
  .logline.warn { color: #faad14; }
  .logline.err { color: #ff7875; }
  /* 统计区（与导出报告同款样式） */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .card { background: #f7f9fd; border-radius: 12px; padding: 16px; text-align: center; }
  .card-num { font-size: 24px; font-weight: 700; color: #4f7cff; }
  .card-label { margin-top: 4px; font-size: 12px; color: #646a73; }
  h3 { font-size: 15px; margin: 20px 0 10px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden;
          font-size: 13px; margin-bottom: 8px; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #f0f2f5; }
  th { background: #fafbfc; color: #646a73; font-weight: 600; font-size: 12px; }
  tbody tr:hover { background: #f7f9ff; }
  tbody tr:last-child td { border-bottom: none; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: 1px; }
  code { background: #f2f4f7; padding: 2px 8px; border-radius: 6px; font-size: 12px; }
  .bar-wrap { background: #eef1f6; border-radius: 99px; height: 10px; min-width: 120px; overflow: hidden; }
  .bar { height: 100%; border-radius: 99px; }
  .hint { font-size: 12px; color: #8a919f; line-height: 1.9; margin-top: 10px; }
  .field { margin-top: 12px; }
  label.check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #1f2329; margin: 0; }
  label.check input { width: auto; margin: 0; }
  /* 规则管理 */
  .tag { display: inline-block; padding: 1px 10px; border-radius: 99px; font-size: 11px; }
  .tag.builtin { background: #eef4ff; color: #4f7cff; }
  .tag.custom { background: #e8f9f0; color: #00b96b; }
  .rule-actions { white-space: nowrap; }
  .rule-actions button { margin-right: 6px; }
  .editor { border: 1px dashed #dcdfe6; border-radius: 12px; padding: 16px 18px; margin-top: 14px; background: #fafbfd; }
  .editor h3 { margin-top: 0; }
  .fields-row { display: grid; grid-template-columns: 160px 1fr 40px; gap: 8px; margin-bottom: 8px; }
  .rule-desc { font-size: 12px; color: #8a919f; align-self: end; padding-bottom: 9px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="vendor/vue.runtime.global.prod.js"></script>
<script src="rules.js"></script>
<script src="collector.js"></script>
</body>
</html>
